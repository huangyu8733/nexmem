<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nexmem 设备地图预览</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; font-family: system-ui, -apple-system, "PingFang SC", sans-serif; }
    #map { width: 100%; height: 100vh; }
    #tip {
      position: fixed; left: 12px; top: 12px; z-index: 999;
      max-width: 72vw; padding: 10px 14px; border-radius: 10px;
      background: rgba(255,255,255,.95); color: #1f2937; font-size: 13px; line-height: 1.5;
      box-shadow: 0 2px 16px rgba(0,0,0,.14);
    }
    #tip b { color: #2563eb; }
  </style>
  <script type="text/javascript">
    // WorkBuddy 默认代理模式：前端不出现 Key，占位符由运行时替换。
    window._TMapSecurityConfig = {
      serviceHost: 'http://127.0.0.1:__WB_HTTP_PORT__/_TMapService/_wbt/__WB_TMAP_SECRET__',
    };
  </script>
  <script src="https://map.qq.com/api/gljs?v=1.exp"></script>
</head>
<body>
  <div id="tip"><b>设备地图预览</b>：示例标注来自本机设备台账的“地区/经纬度”字段；缩放时密集点自动聚合。</div>
  <div id="map"></div>
  <script>
    (function () {
      // 示例数据仅用于展示交互，真实设备由 net.discoverDevices + 台账坐标提供。
      var devices = [
        { id: 'demo-1', name: '书房 Mac', region: '深圳南山', lat: 22.5405, lng: 113.9289 },
        { id: 'demo-2', name: '客厅 Windows', region: '深圳南山', lat: 22.5412, lng: 113.9301 },
        { id: 'demo-3', name: '办公室 Linux', region: '北京海淀', lat: 39.9841, lng: 116.3075 },
        { id: 'demo-4', name: '备用 Android', region: '上海浦东', lat: 31.2304, lng: 121.4737 }
      ];

      var map = new TMap.Map('map', {
        zoom: 5,
        center: new TMap.LatLng(30.5, 116.0),
      });

      function markerSvg(text, color) {
        var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">' +
          '<path fill="' + color + '" d="M24 2C13.5 2 5 10.5 5 21c0 14 19 25 19 25s19-11 19-25C43 10.5 34.5 2 24 2z"/>' +
          '<circle cx="24" cy="21" r="12" fill="white" opacity=".92"/>' +
          '<text x="24" y="26" text-anchor="middle" font-size="11" font-weight="700" fill="' + color + '">' + text + '</text></svg>';
        return 'data:image/svg+xml,' + encodeURIComponent(svg);
      }

      var markerLayer = null;
      function renderMarkers() {
        if (markerLayer) { markerLayer.setMap(null); }
        var zoom = map.getZoom();
        var step = zoom < 8 ? 4 : zoom < 11 ? 1 : zoom < 13 ? 0.2 : zoom < 15 ? 0.05 : 0.01;
        var groups = {};
        devices.forEach(function (d) {
          var key = Math.round(d.lat / step) + ':' + Math.round(d.lng / step);
          if (!groups[key]) { groups[key] = []; }
          groups[key].push(d);
        });
        var geometries = [];
        var styles = {};
        Object.keys(groups).forEach(function (key, index) {
          var group = groups[key];
          var clustered = group.length > 1 && zoom < 15;
          var styleId = 'style-' + index;
          styles[styleId] = new TMap.MarkerStyle({
            width: clustered ? 44 : 32,
            height: clustered ? 44 : 32,
            anchor: { x: clustered ? 22 : 16, y: clustered ? 44 : 32 },
            src: markerSvg(clustered ? String(group.length) : '•', clustered ? '#d97706' : '#2563eb'),
          });
          geometries.push({
            id: key,
            styleId: styleId,
            position: new TMap.LatLng(group[0].lat, group[0].lng),
          });
        });
        markerLayer = new TMap.MultiMarker({ map: map, styles: styles, geometries: geometries });
        markerLayer.on('click', function (evt) {
          var hit = evt && evt.geometry;
          if (!hit) { return; }
          var group = groups[hit.id];
          if (!group) { return; }
          if (group.length === 1) {
            var d = group[0];
            document.getElementById('tip').innerHTML =
              '<b>' + d.name + '</b> · ' + d.region + ' · ' +
              d.lat.toFixed(5) + ', ' + d.lng.toFixed(5);
          } else {
            map.setCenter(new TMap.LatLng(group[0].lat, group[0].lng));
            map.setZoom(Math.min(17, map.getZoom() + 2));
          }
        });
      }

      renderMarkers();
      map.on('zoomend', renderMarkers);
      map.on('dragend', renderMarkers);
    })();
  </script>
</body>
</html>
