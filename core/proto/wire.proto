syntax = "proto3";

package nexmem.v1;

option go_package = "github.com/nexmem/core/api/v1;nexmemv1";

enum FrameType {
  FRAME_TYPE_HELLO = 0;
  FRAME_TYPE_MSG = 1;
  FRAME_TYPE_ACK = 2;
  FRAME_TYPE_READ = 3;
  FRAME_TYPE_TYPING = 4;
  FRAME_TYPE_FILE_OFFER = 5;
  FRAME_TYPE_RTC_SIGNAL = 6;
  FRAME_TYPE_META = 7;
  FRAME_TYPE_FILE_CHUNK = 8;
  FRAME_TYPE_FILE_DONE = 9;
  FRAME_TYPE_RECALL = 10;
  FRAME_TYPE_EDIT = 11;
}

// P2P 流上的一帧：4 字节大端长度 + 本消息序列化字节。
message Frame {
  uint32    version = 1;
  FrameType type = 2;
  bytes     payload = 3;
  bytes     sig = 4; // 发送方设备密钥签名
}

message Ack {
  string msg_uuid = 1;
  int32  code = 2; // 0=ok 1=dup 2=reject
  int64  at = 3;
  uint32 next_chunk = 4; // 文件传输：接收方要求的续传分片（0 表示从头）
}
