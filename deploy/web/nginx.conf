# Nginx 反代示例（P6-10）：TLS + WebSocket
#
# 放置到 /etc/nginx/conf.d/nexmem.conf 并替换证书路径与域名；
# nexmem-webd 监听 127.0.0.1:8082（NEXMEM_WEB_ADDR=127.0.0.1:8082）。
#
# 证书可用 certbot 申请：
#   certbot certonly --webroot -w /var/www/html -d chat.example.com

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name chat.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name chat.example.com;

    ssl_certificate     /etc/letsencrypt/live/chat.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chat.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:nexmem:10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    # 请求体上限与网关 64 KiB 信封约束保持同一量级
    client_max_body_size 1m;

    # 存活探测不经过令牌门禁，便于负载均衡器探活
    location = /healthz {
        proxy_pass http://127.0.0.1:8082;
    }

    location / {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 升级
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # 事件长连接不设短超时，避免心跳被反代掐断
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
    }
}
